---
- name: Install Prometheus on Monitoring Server
  hosts: monitors
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Create prometheus user
      user:
        name: prometheus
        system: yes
        shell: /bin/false
        create_home: no

    - name: Create prometheus directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Download Prometheus
      get_url:
        url: https://github.com/prometheus/prometheus/releases/download/v2.48.0/prometheus-2.48.0.linux-amd64.tar.gz
        dest: /tmp/prometheus.tar.gz

    - name: Extract Prometheus
      unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: Copy Prometheus binaries
      copy:
        src: "/tmp/prometheus-2.48.0.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: yes
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - prometheus
        - promtool

    - name: Copy Prometheus console files
      copy:
        src: "/tmp/prometheus-2.48.0.linux-amd64/{{ item }}"
        dest: "/etc/prometheus/{{ item }}"
        remote_src: yes
        owner: prometheus
        group: prometheus
      loop:
        - consoles
        - console_libraries

    - name: Create Prometheus configuration
      copy:
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s
            external_labels:
              cluster: 'kubernetes'
              environment: 'production'

          rule_files:
            - '/etc/prometheus/rules.yml'

          alerting:
            alertmanagers:
              - static_configs:
                  - targets:
                      - localhost:9093

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'kubernetes-apiservers'
              kubernetes_sd_configs:
                - api_server: https://{{ hostvars[groups['masters'][0]].ansible_host }}:6443
                  role: endpoints
                  tls_config:
                    insecure_skip_verify: true
                  bearer_token_file: /etc/prometheus/k8s-token
              scheme: https
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /etc/prometheus/k8s-token
              relabel_configs:
                - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
                  action: keep
                  regex: default;kubernetes;https

            - job_name: 'kubernetes-nodes'
              kubernetes_sd_configs:
                - api_server: https://{{ hostvars[groups['masters'][0]].ansible_host }}:6443
                  role: node
                  tls_config:
                    insecure_skip_verify: true
                  bearer_token_file: /etc/prometheus/k8s-token
              scheme: https
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /etc/prometheus/k8s-token
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)

            - job_name: 'kubernetes-pods'
              kubernetes_sd_configs:
                - api_server: https://{{ hostvars[groups['masters'][0]].ansible_host }}:6443
                  role: pod
                  tls_config:
                    insecure_skip_verify: true
                  bearer_token_file: /etc/prometheus/k8s-token
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: 'true'
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $1:$2
                  target_label: __address__
                - action: labelmap
                  regex: __meta_kubernetes_pod_label_(.+)
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: kubernetes_namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: kubernetes_pod_name

            - job_name: 'kubernetes-cadvisor'
              kubernetes_sd_configs:
                - api_server: https://{{ hostvars[groups['masters'][0]].ansible_host }}:6443
                  role: node
                  tls_config:
                    insecure_skip_verify: true
                  bearer_token_file: /etc/prometheus/k8s-token
              scheme: https
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /etc/prometheus/k8s-token
              metrics_path: /metrics/cadvisor
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)

            - job_name: 'kube-state-metrics'
              kubernetes_sd_configs:
                - api_server: https://{{ hostvars[groups['masters'][0]].ansible_host }}:6443
                  role: service
                  tls_config:
                    insecure_skip_verify: true
                  bearer_token_file: /etc/prometheus/k8s-token
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  action: keep
                  regex: kube-state-metrics
                - source_labels: [__meta_kubernetes_namespace]
                  action: keep
                  regex: kube-system
                - source_labels: [__meta_kubernetes_service_port_name]
                  action: keep
                  regex: http-metrics

            - job_name: 'node-exporter'
              kubernetes_sd_configs:
                - api_server: https://{{ hostvars[groups['masters'][0]].ansible_host }}:6443
                  role: pod
                  tls_config:
                    insecure_skip_verify: true
                  bearer_token_file: /etc/prometheus/k8s-token
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app]
                  action: keep
                  regex: node-exporter
                - source_labels: [__meta_kubernetes_pod_node_name]
                  action: replace
                  target_label: node
                - source_labels: [__meta_kubernetes_pod_host_ip]
                  action: replace
                  target_label: __address__
                  regex: (.+)
                  replacement: $1:9100
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0644'

    - name: Create Prometheus alerting rules
      copy:
        content: |
          groups:
          - name: kubernetes.rules
            interval: 30s
            rules:
            - alert: KubernetesNodeNotReady
              expr: kube_node_status_condition{condition="Ready",status="true"} == 0
              for: 30s
              labels:
                severity: critical
              annotations:
                summary: "Node {{ "{{" }} $labels.node {{ "}}" }} not ready"
                description: "Node {{ "{{" }} $labels.node {{ "}}" }} has been unready for a long time"

            - alert: KubernetesMemoryPressure
              expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
              for: 30s
              labels:
                severity: warning
              annotations:
                summary: "Node {{ "{{" }} $labels.node {{ "}}" }} memory pressure"
                description: "Node {{ "{{" }} $labels.node {{ "}}" }} has MemoryPressure condition"

            - alert: KubernetesDiskPressure
              expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
              for: 30s
              labels:
                severity: warning
              annotations:
                summary: "Node {{ "{{" }} $labels.node {{ "}}" }} disk pressure"
                description: "Node {{ "{{" }} $labels.node {{ "}}" }} has DiskPressure condition"

            - alert: KubernetesPodCrashLooping
              expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
              for: 30s
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} is crash looping"
                description: "Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} has restarted {{ "{{" }} $value {{ "}}" }} times in the last 15 minutes"

            - alert: KubernetesNodeHighCPU
              expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
              for: 30s
              labels:
                severity: warning
              annotations:
                summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} high CPU usage"
                description: "Node {{ "{{" }} $labels.instance {{ "}}" }} has CPU usage above 80% for more than 30 seconds"

            - alert: KubernetesNodeHighMemory
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
              for: 30s
              labels:
                severity: warning
              annotations:
                summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} high memory usage"
                description: "Node {{ "{{" }} $labels.instance {{ "}}" }} has memory usage above 85% for more than 30 seconds"
        dest: /etc/prometheus/rules.yml
        owner: prometheus
        group: prometheus
        mode: '0644'

    - name: Create Prometheus systemd service
      copy:
        content: |
          [Unit]
          Description=Prometheus
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus/ \
            --web.console.templates=/etc/prometheus/consoles \
            --web.console.libraries=/etc/prometheus/console_libraries \
            --web.listen-address=0.0.0.0:9090 \
            --web.enable-lifecycle \
            --web.enable-admin-api

          Restart=always
          RestartSec=10s

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/prometheus.service
        mode: '0644'

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and start Prometheus
      systemd:
        name: prometheus
        state: started
        enabled: yes

    - name: Restart Prometheus to reload configuration
      systemd:
        name: prometheus
        state: restarted

    - name: Wait for Prometheus to be ready
      wait_for:
        port: 9090
        delay: 5
        timeout: 60

    - name: Display Prometheus access info
      debug:
        msg: |
          Prometheus is now running on monitoring server!
          Access URL: http://{{ ansible_default_ipv4.address }}:9090
          Provider Network Access: http://{{ hostvars[inventory_hostname].ansible_host }}:9090

- name: Setup Kubernetes for External Prometheus
  hosts: masters
  become: yes
  vars:
    api_master: "{{ groups['masters'][0] }}"
  tasks:
    - name: Wait for API server to be ready
      wait_for:
        port: 6443
        host: "127.0.0.1"
        delay: 5
        timeout: 120
        state: started
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Ensure kubectl can reach API server
      shell: kubectl get nodes --request-timeout=10s --kubeconfig=/etc/kubernetes/admin.conf
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: api_ready
      until: api_ready.rc == 0
      retries: 24
      delay: 5
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Create kube-system namespace if not exists
      shell: kubectl create namespace kube-system --kubeconfig=/etc/kubernetes/admin.conf
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      ignore_errors: yes
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Create ServiceAccount for Prometheus
      shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: prometheus
          namespace: kube-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: prometheus
        rules:
        - apiGroups: [""]
          resources:
          - nodes
          - nodes/proxy
          - nodes/metrics
          - services
          - endpoints
          - pods
          verbs: ["get", "list", "watch"]
        - apiGroups: ["extensions", "networking.k8s.io"]
          resources:
          - ingresses
          verbs: ["get", "list", "watch"]
        - nonResourceURLs:
          - /metrics
          - /metrics/cadvisor
          verbs: ["get"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: prometheus
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: prometheus
        subjects:
        - kind: ServiceAccount
          name: prometheus
          namespace: kube-system
        EOF
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Create token secret for Prometheus
      shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Secret
        metadata:
          name: prometheus-token
          namespace: kube-system
          annotations:
            kubernetes.io/service-account.name: prometheus
        type: kubernetes.io/service-account-token
        EOF
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Wait for token to be generated
      shell: kubectl get secret prometheus-token -n kube-system -o jsonpath='{.data.token}' --kubeconfig=/etc/kubernetes/admin.conf
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: token_check
      until: token_check.stdout != ""
      retries: 10
      delay: 2
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Get Prometheus token
      shell: kubectl get secret prometheus-token -n kube-system -o jsonpath='{.data.token}' --kubeconfig=/etc/kubernetes/admin.conf | base64 -d
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: prometheus_token
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Deploy node-exporter DaemonSet
      shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: node-exporter
          namespace: kube-system
          labels:
            app: node-exporter
        spec:
          selector:
            matchLabels:
              app: node-exporter
          template:
            metadata:
              labels:
                app: node-exporter
              annotations:
                prometheus.io/scrape: 'true'
                prometheus.io/port: '9100'
            spec:
              hostNetwork: true
              hostPID: true
              tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
              - key: node-role.kubernetes.io/master
                operator: Exists
                effect: NoSchedule
              containers:
              - name: node-exporter
                image: prom/node-exporter:latest
                args:
                  - '--path.procfs=/host/proc'
                  - '--path.sysfs=/host/sys'
                  - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
                ports:
                - containerPort: 9100
                  name: metrics
                  hostPort: 9100
                volumeMounts:
                - name: proc
                  mountPath: /host/proc
                  readOnly: true
                - name: sys
                  mountPath: /host/sys
                  readOnly: true
                - name: rootfs
                  mountPath: /rootfs
                  readOnly: true
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi
              volumes:
              - name: proc
                hostPath:
                  path: /proc
              - name: sys
                hostPath:
                  path: /sys
              - name: rootfs
                hostPath:
                  path: /
        EOF
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Wait for node-exporter to be ready
      shell: kubectl rollout status daemonset/node-exporter -n kube-system --timeout=120s --kubeconfig=/etc/kubernetes/admin.conf
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Delete existing kube-state-metrics service if it exists
      shell: kubectl delete service kube-state-metrics -n kube-system --ignore-not-found=true --kubeconfig=/etc/kubernetes/admin.conf
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Deploy kube-state-metrics
      shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: kube-state-metrics
          namespace: kube-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: kube-state-metrics
        rules:
        - apiGroups: [""]
          resources: ["configmaps", "secrets", "nodes", "pods", "services", "resourcequotas", "replicationcontrollers", "limitranges", "persistentvolumeclaims", "persistentvolumes", "namespaces", "endpoints"]
          verbs: ["list", "watch"]
        - apiGroups: ["apps"]
          resources: ["statefulsets", "daemonsets", "deployments", "replicasets"]
          verbs: ["list", "watch"]
        - apiGroups: ["batch"]
          resources: ["jobs", "cronjobs"]
          verbs: ["list", "watch"]
        - apiGroups: ["autoscaling"]
          resources: ["horizontalpodautoscalers"]
          verbs: ["list", "watch"]
        - apiGroups: ["policy"]
          resources: ["poddisruptionbudgets"]
          verbs: ["list", "watch"]
        - apiGroups: ["certificates.k8s.io"]
          resources: ["certificatesigningrequests"]
          verbs: ["list", "watch"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["storageclasses", "volumeattachments"]
          verbs: ["list", "watch"]
        - apiGroups: ["admissionregistration.k8s.io"]
          resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
          verbs: ["list", "watch"]
        - apiGroups: ["networking.k8s.io"]
          resources: ["networkpolicies", "ingresses"]
          verbs: ["list", "watch"]
        - apiGroups: ["coordination.k8s.io"]
          resources: ["leases"]
          verbs: ["list", "watch"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: kube-state-metrics
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: kube-state-metrics
        subjects:
        - kind: ServiceAccount
          name: kube-state-metrics
          namespace: kube-system
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: kube-state-metrics
          namespace: kube-system
          labels:
            app: kube-state-metrics
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: kube-state-metrics
          template:
            metadata:
              labels:
                app: kube-state-metrics
            spec:
              serviceAccountName: kube-state-metrics
              containers:
              - name: kube-state-metrics
                image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.12.0
                ports:
                - containerPort: 8080
                  name: http-metrics
                - containerPort: 8081
                  name: telemetry
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  timeoutSeconds: 5
                readinessProbe:
                  httpGet:
                    path: /
                    port: 8081
                  initialDelaySeconds: 5
                  timeoutSeconds: 5
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: kube-state-metrics
          namespace: kube-system
          labels:
            app: kube-state-metrics
        spec:
          type: ClusterIP
          selector:
            app: kube-state-metrics
          ports:
          - name: http-metrics
            port: 8080
            targetPort: http-metrics
          - name: telemetry
            port: 8081
            targetPort: telemetry
        EOF
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Wait for kube-state-metrics to be ready
      shell: kubectl rollout status deployment/kube-state-metrics -n kube-system --timeout=120s --kubeconfig=/etc/kubernetes/admin.conf
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Verify all components are running
      shell: |
        echo "=== Node Exporter ==="
        kubectl get daemonset node-exporter -n kube-system --kubeconfig=/etc/kubernetes/admin.conf
        echo ""
        echo "=== Kube State Metrics ==="
        kubectl get deployment kube-state-metrics -n kube-system --kubeconfig=/etc/kubernetes/admin.conf
        echo ""
        echo "=== All Pods ==="
        kubectl get pods -n kube-system -l 'app in (node-exporter,kube-state-metrics)' --kubeconfig=/etc/kubernetes/admin.conf
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: component_status
      run_once: true
      delegate_to: "{{ api_master }}"

    - name: Display component status
      debug:
        var: component_status.stdout_lines
      run_once: true

    - name: Save token to local file
      copy:
        content: "{{ hostvars[api_master].prometheus_token.stdout }}"
        dest: /tmp/k8s-prometheus-token
      run_once: true
      delegate_to: localhost
      become: no

- name: Transfer Kubernetes token to Prometheus server
  hosts: monitors
  become: yes
  tasks:
    - name: Copy Kubernetes token to Prometheus server
      copy:
        src: /tmp/k8s-prometheus-token
        dest: /etc/prometheus/k8s-token
        owner: prometheus
        group: prometheus
        mode: '0600'

    - name: Restart Prometheus to apply configuration
      systemd:
        name: prometheus
        state: restarted

    - name: Wait for Prometheus to restart
      wait_for:
        port: 9090
        delay: 5
        timeout: 60

    - name: Display final access information
      debug:
        msg: |
          ================================================
          PROMETHEUS STANDALONE INSTALLATION COMPLETE
          ================================================
          
          Access Prometheus Dashboard:
          Provider Network: http://{{ hostvars[inventory_hostname].ansible_host }}:9090
          
          Configuration:
          - Scraping metrics from Kubernetes cluster at {{ hostvars[groups['masters'][0]].ansible_host }}:6443
          - Monitoring all nodes via node-exporter
          - Collecting pod metrics via kube-state-metrics
          - Alert rules configured
          
          Verify targets at:
          http://{{ hostvars[inventory_hostname].ansible_host }}:9090/targets
          
          Expected targets:
          - prometheus (1/1)
          - kubernetes-apiservers (1/1)
          - kubernetes-nodes (2/2)
          - kubernetes-cadvisor (2/2)
          - node-exporter (2/2)
          - kube-state-metrics (1/1)
          
          Next steps:
          1. Install Alertmanager (run install-alertmanager.yaml)
          2. Install Grafana (run install-grafana.yaml)
          ================================================