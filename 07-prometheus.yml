---
- name: Install Prometheus
  hosts: masters
  become: yes
  tasks:
    - name: Create prometheus namespace
      shell: kubectl create namespace prometheus --kubeconfig=/etc/kubernetes/admin.conf
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      ignore_errors: yes
      register: ns_result
      changed_when: "'created' in ns_result.stdout"

    - name: Create prometheus config directory
      file:
        path: /etc/prometheus
        state: directory
        mode: '0755'

    - name: Create Prometheus ServiceAccount
      shell: |
        cat <<EOF | kubectl apply --validate=false -f -
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: prometheus
          namespace: prometheus
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: prometheus
        rules:
        - apiGroups: [""]
          resources:
          - nodes
          - nodes/proxy
          - services
          - endpoints
          - pods
          verbs: ["get", "list", "watch"]
        - apiGroups: ["extensions"]
          resources:
          - ingresses
          verbs: ["get", "list", "watch"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: prometheus
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: prometheus
        subjects:
        - kind: ServiceAccount
          name: prometheus
          namespace: prometheus
        EOF
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: rbac_result
      changed_when: "'created' in rbac_result.stdout or 'configured' in rbac_result.stdout"

    - name: Create prometheus ConfigMap
      shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: prometheus-config
          namespace: prometheus
        data:
          prometheus.yml: |
            global:
              scrape_interval: 15s
              evaluation_interval: 15s
              external_labels:
                cluster: 'kubernetes'
                environment: 'production'

            rule_files:
              - '/etc/prometheus/rules.yml'

            alerting:
              alertmanagers:
                - static_configs:
                    - targets:
                        - alertmanager:9093

            scrape_configs:
              - job_name: 'prometheus'
                static_configs:
                  - targets: ['localhost:9090']

              - job_name: 'kubernetes-apiservers'
                kubernetes_sd_configs:
                  - role: endpoints
                scheme: https
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
                    action: keep
                    regex: default;kubernetes;https

              - job_name: 'kubernetes-nodes'
                kubernetes_sd_configs:
                  - role: node
                scheme: https
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - action: labelmap
                    regex: __meta_kubernetes_node_label_(.+)

              - job_name: 'kubernetes-pods'
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    action: keep
                    regex: 'true'
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
                  - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                    action: replace
                    regex: '([^:]+)(?::\d+)?;(\d+)'
                    replacement: '$1:$2'
                    target_label: __address__

              - job_name: 'kubernetes-services'
                kubernetes_sd_configs:
                  - role: service
                metrics_path: /probe
                params:
                  module: [http_2xx]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe]
                    action: keep
                    regex: 'true'
                  - source_labels: [__address__]
                    target_label: __param_target
                  - target_label: __address__
                    replacement: localhost:9115
                  - source_labels: [__param_target]
                    target_label: instance
                  - action: labelmap
                    regex: __meta_kubernetes_service_label_(.+)
                  - source_labels: [__meta_kubernetes_namespace]
                    action: replace
                    target_label: kubernetes_namespace
                  - source_labels: [__meta_kubernetes_service_name]
                    action: replace
                    target_label: kubernetes_name

              - job_name: 'kubernetes-ingress'
                kubernetes_sd_configs:
                  - role: ingress
                relabel_configs:
                  - source_labels: [__meta_kubernetes_ingress_annotation_prometheus_io_probe]
                    action: keep
                    regex: 'true'
                  - source_labels: [__meta_kubernetes_ingress_scheme,__address__,__meta_kubernetes_ingress_path]
                    action: replace
                    regex: '([^:]+)(?::\d+)?;(.*);(.*)'
                    replacement: '${1}://${2}${3}'
                    target_label: __param_target
                  - target_label: __address__
                    replacement: localhost:9115
                  - action: labelmap
                    regex: __meta_kubernetes_ingress_label_(.+)
                  - source_labels: [__meta_kubernetes_namespace]
                    action: replace
                    target_label: kubernetes_namespace
                  - source_labels: [__meta_kubernetes_ingress_name]
                    action: replace
                    target_label: kubernetes_name

          rules.yml: |
            groups:
            - name: kubernetes.rules
              interval: 30s
              rules:
              - alert: KubernetesNodeNotReady
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Node {{ $labels.node }} not ready"
                  description: "Node {{ $labels.node }} has been unready for a long time"

              - alert: KubernetesMemoryPressure
                expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Node {{ $labels.node }} memory pressure"
                  description: "Node {{ $labels.node }} has MemoryPressure condition"

              - alert: KubernetesDiskPressure
                expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Node {{ $labels.node }} disk pressure"
                  description: "Node {{ $labels.node }} has DiskPressure condition"
        EOF
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: configmap_result
      changed_when: "'created' in configmap_result.stdout or 'configured' in configmap_result.stdout"

    - name: Deploy Prometheus
      shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: prometheus
          namespace: prometheus
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: prometheus
          template:
            metadata:
              labels:
                app: prometheus
            spec:
              serviceAccountName: prometheus
              containers:
              - name: prometheus
                image: prom/prometheus:latest
                args:
                  - '--config.file=/etc/prometheus/prometheus.yml'
                  - '--storage.tsdb.path=/prometheus'
                  - '--web.console.libraries=/usr/share/prometheus/console_libraries'
                  - '--web.console.templates=/usr/share/prometheus/consoles'
                  - '--web.enable-lifecycle'
                  - '--web.enable-admin-api'
                ports:
                - containerPort: 9090
                  name: web
                volumeMounts:
                - name: config
                  mountPath: /etc/prometheus
                - name: storage
                  mountPath: /prometheus
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 1Gi
              volumes:
              - name: config
                configMap:
                  name: prometheus-config
              - name: storage
                emptyDir: {}
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: prometheus
          namespace: prometheus
        spec:
          selector:
            app: prometheus
          ports:
          - port: 9090
            targetPort: 9090
            nodePort: 30090
            name: web
          type: NodePort
        EOF
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: deploy_result
      changed_when: "'created' in deploy_result.stdout or 'configured' in deploy_result.stdout"

    - name: Wait for Prometheus deployment
      shell: kubectl rollout status deployment/prometheus -n prometheus --kubeconfig=/etc/kubernetes/admin.conf
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      retries: 15
      delay: 10

    - name: Get Prometheus NodePort
      shell: kubectl get service prometheus -n prometheus --kubeconfig=/etc/kubernetes/admin.conf -o jsonpath='{.spec.ports[0].nodePort}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: prometheus_nodeport
      changed_when: false

    - name: Display Prometheus Access Info
      debug:
        msg: |
          Prometheus is now deployed and accessible!
          Access Prometheus via: http://MASTER_NODE_IP:{{ prometheus_nodeport.stdout }}
          Prometheus Service URL (internal): http://prometheus.prometheus.svc.cluster.local:9090
