---
- name: Install Kubernetes
  hosts: all
  become: yes
  vars:
    kubernetes_version: "1.35.1"
    # pkgs.k8s.io uses one repo per minor version (e.g. v1.35 for 1.35.x)
    k8s_repo_version: "v{{ kubernetes_version | regex_replace('^([0-9]+\\.[0-9]+).*', '\\1') }}"
  roles:
    - role: hexaweb
      hexaweb_tasks_from: 03-kubernetes.yml

