[defaults]
inventory = openstack.yaml
roles_path = ./roles
host_key_checking = False
remote_user = ubuntu
private_key_file = /root/.ssh/id_ed25519
 
[inventory]
enable_plugins = openstack.cloud.openstack
cache = yes
cache_plugin = jsonfile
cache_timeout = 3600
cache_connection = /tmp/ansible_inventory_cache
 
[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
