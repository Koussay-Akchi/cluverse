- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Random sleep to stagger mirror hits
  ansible.builtin.pause:
    seconds: "{{ 5 | random(seed=inventory_hostname) }}"

- name: Stop and disable unattended-upgrades
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - unattended-upgrades
    - apt-daily.timer
    - apt-daily-upgrade.timer
  ignore_errors: yes

- name: Force lower MTU for OpenStack stability (prevents TCP stalls)
  ansible.builtin.shell: |
    ip link set dev eth0 mtu 1400 || true
  changed_when: false

- name: Disable IPv6 at kernel level (prevents DNS/Mirror hangs)
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    state: present
    sysctl_set: yes
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
    - net.ipv6.conf.lo.disable_ipv6

- name: Optimize APT Mirrors (Switch to Global Archive)
  ansible.builtin.shell: |
    sed -i 's/http:\/\/.*archive.ubuntu.com/http:\/\/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
    echo 'Acquire::Queue-Mode "access";' > /etc/apt/apt.conf.d/99parallel
  changed_when: true

- name: Nuclear clear of apt/dpkg locks and zombies
  ansible.builtin.shell: |
    killall -9 apt apt-get dpkg 2>/dev/null || true
    rm -f /var/lib/apt/lists/lock
    rm -f /var/cache/apt/archives/lock
    rm -f /var/lib/dpkg/lock*
    dpkg --configure -a
  changed_when: false
  ignore_errors: yes

- name: Update apt cache (Shell version with aggressive timeouts)
  ansible.builtin.shell: |
    apt-get update
  register: apt_update_result
  retries: 5
  delay: 10
  until: apt_update_result.rc == 0

- name: Install required packages (Robust version)
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - net-tools
      - jq
      - wget
    state: present
    force_apt_get: yes
    update_cache: no

- name: Disable swap
  ansible.builtin.command: swapoff -a
  ignore_errors: yes

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '.*\s+swap\s+.*'
    state: absent

- name: Load overlay module
  ansible.builtin.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present

- name: Persist kernel modules
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'

- name: Configure sysctl for Kubernetes
  ansible.builtin.copy:
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    dest: /etc/sysctl.d/k8s.conf
    mode: '0644'

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system

