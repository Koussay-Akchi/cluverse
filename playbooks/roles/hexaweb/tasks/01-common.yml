- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Random sleep to stagger mirror hits
  ansible.builtin.pause:
    seconds: "{{ 5 | random(seed=inventory_hostname) }}"

- name: Stop and disable unattended-upgrades
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - unattended-upgrades
    - apt-daily.timer
    - apt-daily-upgrade.timer
  ignore_errors: yes

- name: Force apt to use IPv4
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/99force-ipv4
    line: 'Acquire::ForceIPv4 "true";'
    create: yes

- name: Wait for apt lock
  ansible.builtin.shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
      echo "Waiting for other apt instance to finish..."
      sleep 5
    done
  changed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
    force_apt_get: yes

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - net-tools
      - jq
      - wget
    state: present
    force_apt_get: yes

- name: Disable swap
  ansible.builtin.command: swapoff -a
  ignore_errors: yes

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '.*\s+swap\s+.*'
    state: absent

- name: Load overlay module
  ansible.builtin.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present

- name: Persist kernel modules
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'

- name: Configure sysctl for Kubernetes
  ansible.builtin.copy:
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    dest: /etc/sysctl.d/k8s.conf
    mode: '0644'

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system

