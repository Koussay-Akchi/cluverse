---
- name: Install containerd
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Remove existing Docker repository
      file:
        path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
        state: absent

    - name: Add Docker repository
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: no

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Install containerd
      apt:
        name: containerd.io
        state: present
        update_cache: no

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable systemd cgroup driver for containerd 1.x
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '(\s*)SystemdCgroup\s*=\s*false'
        line: '\1SystemdCgroup = true'
        backrefs: yes

    - name: Ensure cri is not disabled
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: 'disabled_plugins\s*=\s*\["cri"\]'
        state: absent

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes
        daemon_reload: yes
