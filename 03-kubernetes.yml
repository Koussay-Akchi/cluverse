---
- name: Install Kubernetes
  hosts: all
  become: yes
  vars:
    kubernetes_version: "1.35.1"
  tasks:
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    - name: Download Kubernetes GPG key
      get_url:
        url: "https://dl.k8s.io/apt/doc/apt-key.gpg"
        dest: /tmp/kubernetes-release.key
    - name: Add Kubernetes GPG key
      shell: cat /tmp/kubernetes-release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg --yes
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    - name: Add Kubernetes repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://apt.kubernetes.io/ kubernetes-xenial main"
        state: present
    - name: Install kubelet kubeadm kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes
    - name: Hold kubelet
      dpkg_selections:
        name: kubelet
        selection: hold
    - name: Hold kubeadm
      dpkg_selections:
        name: kubeadm
        selection: hold
    - name: Hold kubectl
      dpkg_selections:
        name: kubectl
        selection: hold

    - name: Create kubelet systemd drop-in directory
      file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        mode: '0755'

    - name: Ensure kubelet starts after containerd and recovers
      copy:
        content: |
          [Unit]
          After=containerd.service network-online.target
          Wants=containerd.service network-online.target

          [Service]
          Restart=always
          RestartSec=5
        dest: /etc/systemd/system/kubelet.service.d/10-ansible.conf
        mode: '0644'

    - name: Reload systemd for kubelet drop-in
      systemd:
        daemon_reload: yes

    - name: Wait for containerd to be ready before starting kubelet
      wait_for:
        path: /run/containerd/containerd.sock
        timeout: 60
      when: ansible_service_mgr == "systemd"

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started