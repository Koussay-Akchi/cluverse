---
- name: Install Kubernetes
  hosts: all
  become: yes
  vars:
    kubernetes_version: "1.35.1"
    # pkgs.k8s.io uses one repo per minor version (e.g. v1.35 for 1.35.x)
    k8s_repo_version: "v{{ kubernetes_version | regex_replace('^([0-9]+\\.[0-9]+).*', '\\1') }}"
  tasks:
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Remove legacy Kubernetes apt repo (apt.kubernetes.io / kubernetes-xenial)
      lineinfile:
        path: "{{ item }}"
        state: absent
        regexp: 'apt\.kubernetes\.io|packages\.cloud\.google\.com|kubernetes-xenial'
      loop:
        - /etc/apt/sources.list
        - /etc/apt/sources.list.d/kubernetes.list
      ignore_errors: yes

    - name: Download Kubernetes package repository signing key (pkgs.k8s.io)
      get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_repo_version }}/deb/Release.key"
        dest: /tmp/kubernetes-Release.key

    - name: Add Kubernetes GPG key
      shell: cat /tmp/kubernetes-Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg --yes

    - name: Add Kubernetes repository (pkgs.k8s.io community-owned)
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_repo_version }}/deb/ /"
        state: present
        filename: kubernetes
    - name: Install kubelet kubeadm kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes
    - name: Hold kubelet
      dpkg_selections:
        name: kubelet
        selection: hold
    - name: Hold kubeadm
      dpkg_selections:
        name: kubeadm
        selection: hold
    - name: Hold kubectl
      dpkg_selections:
        name: kubectl
        selection: hold

    - name: Create kubelet systemd drop-in directory
      file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        mode: '0755'

    - name: Ensure kubelet starts after containerd and recovers
      copy:
        content: |
          [Unit]
          After=containerd.service network-online.target
          Wants=containerd.service network-online.target

          [Service]
          Restart=always
          RestartSec=5
        dest: /etc/systemd/system/kubelet.service.d/10-ansible.conf
        mode: '0644'

    - name: Reload systemd for kubelet drop-in
      systemd:
        daemon_reload: yes

    - name: Wait for containerd to be ready before starting kubelet
      wait_for:
        path: /run/containerd/containerd.sock
        timeout: 60
      when: ansible_service_mgr == "systemd"

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started