---
- name: Join workers
  hosts: workers
  become: yes
  tasks:
    - name: Check if joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf
 
    - name: Read join command
      set_fact:
        join_cmd: "{{ lookup('file', '/tmp/kubeadm_join.sh') }}"
      when: not kubelet_conf.stat.exists
 
    - name: Join cluster
      command: "{{ join_cmd }}"
      when: not kubelet_conf.stat.exists