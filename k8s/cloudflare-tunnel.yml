apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-token
  namespace: cluverse
type: Opaque
stringData:
  token: "{{ cloudflare_tunnel_token }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cluverse
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 1
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        - --token
        - "$(TUNNEL_TOKEN)"
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-tunnel-token
              key: token
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
