apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-proxy-config
  namespace: cluverse
data:
  nginx.conf: |
    server {
        listen 80;
        
        # Proxy API requests to the API Gateway
        location /api/ {
            proxy_pass http://api-gateway:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy all other requests to the Frontend
        location / {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-proxy
  namespace: cluverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-proxy
  template:
    metadata:
      labels:
        app: ingress-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: ingress-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-proxy
  namespace: cluverse
spec:
  type: NodePort
  selector:
    app: ingress-proxy
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30099
