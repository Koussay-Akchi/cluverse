apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-cluverse
  namespace: cluverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: events-cluverse
  template:
    metadata:
      labels:
        app: events-cluverse
    spec:
      containers:
        - name: events-cluverse
          image: akchikoussay/events-cluverse:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cluverse-config
            - secretRef:
                name: cluverse-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: events-cluverse
  namespace: cluverse
spec:
  selector:
    app: events-cluverse
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
