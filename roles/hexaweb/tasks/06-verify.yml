---
- name: Wait for nodes
  ansible.builtin.shell: kubectl get nodes --no-headers 2>/dev/null | grep -c " Ready " || echo "0"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ready_nodes
  until: ready_nodes.stdout | int > 0
  retries: 30
  delay: 10

- name: Get nodes
  ansible.builtin.command: kubectl get nodes -o wide
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: nodes

- name: Show nodes
  ansible.builtin.debug:
    var: nodes.stdout_lines

- name: Wait for CoreDNS
  ansible.builtin.shell: kubectl get pods -n kube-system -l k8s-app=kube-dns --field-selector=status.phase=Running 2>/dev/null | wc -l
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: coredns_ready
  until: coredns_ready.stdout | int > 0
  retries: 30
  delay: 10

- name: Cluster status
  ansible.builtin.debug:
    msg: "Kubernetes cluster initialized successfully with {{ ready_nodes.stdout }} node(s) ready"

