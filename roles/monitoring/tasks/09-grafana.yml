- name: Configure Grafana to listen on all interfaces
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?http_addr ='
    line: 'http_addr = 0.0.0.0'
    state: present

- name: Configure Grafana port
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?http_port ='
    line: 'http_port = 3000'
    state: present

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: started
    enabled: yes

- name: Wait for Grafana to be ready
  ansible.builtin.wait_for:
    port: 3000
    delay: 5
    timeout: 60

- name: Display Grafana access info
  ansible.builtin.debug:
    msg: |
      ================================================
      GRAFANA STANDALONE INSTALLATION COMPLETE
      ================================================
      
      Access Grafana Dashboard:
      Provider Network: http://{{ "{{" }} hostvars[inventory_hostname].ansible_host {{ "}}" }}:3000
      
      Default Credentials:
      Username: admin
      Password: admin
      (You will be prompted to change password on first login)
      
      Configuration:
      - Prometheus datasource configured automatically
      - Kubernetes cluster dashboard pre-loaded
      - Dashboard updates allowed
      
      ================================================
      
      COMPLETE MONITORING STACK URLS:
      ================================================
      Grafana:       http://{{ "{{" }} hostvars[inventory_hostname].ansible_host {{ "}}" }}:3000
      Prometheus:    http://{{ "{{" }} hostvars[inventory_hostname].ansible_host {{ "}}" }}:9090
      Alertmanager:  http://{{ "{{" }} hostvars[inventory_hostname].ansible_host {{ "}}" }}:9093
      ================================================

